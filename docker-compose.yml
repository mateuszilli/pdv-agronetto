services:
  postgres:
    image: postgres:16
    container_name: pdv-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pdv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pdv}
      POSTGRES_DB: ${POSTGRES_DB:-pdv}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pdv_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pdv} -d ${POSTGRES_DB:-pdv}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pdv_postgres_data:
